name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build zip
        run: make release VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/Claude Profiles.zip" \
            --title "Claude Profiles $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Unsigned build. After unzipping, right-click the app and choose Open, or run: \`xattr -dr com.apple.quarantine ~/Applications/Claude\ Profiles.app\`"
